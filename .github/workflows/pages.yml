name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      minimal_site:
        description: Deploy a tiny test page instead of the wiki
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate generated data
        if: ${{ !inputs.minimal_site }}
        run: node scripts/check-data.js
      - name: Prepare static site
        if: ${{ !inputs.minimal_site }}
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -R wiki assets _site/
          rsync -a \
            --exclude='/README.md' \
            --exclude='/equipment.json' \
            --exclude='/weapon-pages.json' \
            --exclude='/item-extras.json' \
            --exclude='/weapon-details/index.json' \
            data/ _site/data/
          touch _site/.nojekyll
      - name: Prepare minimal test site
        if: ${{ inputs.minimal_site }}
        run: |
          mkdir -p _site
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>Pages test</title><h1>GitHub Pages deployment works</h1></html>' > _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1800000'
